[project]
name = "hybrid-router"
version = "0.0.0"
description = "Hand well-specified coding tasks from Claude Code to a local model, with tests as the gate"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.26.0",
    "mcp>=2.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["router"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
preview = true
explicit-preview-rules = true
extend-select = ["PLW1514"]

[tool.pytest.ini_options]
testpaths = ["tests"]
